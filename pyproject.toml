[project]
name = "sloppy"
version = "0.1.0"
description = "Slop-or-not: YouTube content quality classifier"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.15",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
    "alembic>=1.20.0",
    "google-api-python-client>=2.200.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
slop = "sloppy.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sloppy"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
