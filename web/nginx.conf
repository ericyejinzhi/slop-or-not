server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing - any unmatched path falls back to index.html
    # instead of nginx's own 404, so a hard refresh on e.g. /videos/abc123 still works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same relative /api/* -> backend proxy the Vite dev server does (web/vite.config.ts)
    # - the frontend code never needs to know whether it's talking to Vite's dev proxy or
    # this nginx config.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
