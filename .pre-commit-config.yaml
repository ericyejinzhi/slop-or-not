repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # --unsafe = only check that the file parses, without constructing objects.
        # docker-compose.aws.yml uses Compose's own !reset / !override merge tags, which
        # are valid Compose but not standard YAML tags, so strict loading rejects them.
        args: [--unsafe]
      - id: check-added-large-files
      - id: detect-private-key
