services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-slopornot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slop} -d ${POSTGRES_DB:-slopornot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slopadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-slop_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 5. Day-to-day development still runs `uv run uvicorn ... --reload` directly on
  # the host against these services' published ports - this service is for "does the
  # container build and boot" verification, not the primary dev loop. Note: presigned
  # thumbnail URLs generated by THIS service embed http://minio:9000 (the compose-internal
  # hostname), unreachable from a host browser - see docs/writeups/phase-5/stage-9-docker-compose.md.
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 7. Prefect's own orchestration API/UI - self-contained (its own SQLite store
  # for flow-run history/deployments), not sharing the app's Postgres. Flow code itself
  # (the sloppy package, torch, etc.) runs via `uv run slop orchestrate serve` on the
  # host, not in this container - this service is just the server/UI.
  prefect-server:
    image: prefecthq/prefect:3-python3.12
    command: prefect server start --host 0.0.0.0
    ports:
      - "${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefectdata:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Phase 8. Production-shaped static build + nginx, reverse-proxying /api/* to `api`
  # exactly like the Vite dev server's own proxy (web/vite.config.ts) - the frontend code
  # (BASE_URL = '/api' in web/src/api/client.ts) never changes between dev and this
  # container. Not part of the day-to-day dev loop (that's still `npm run dev`) - this is
  # a "does the production build/serve path work" smoke test, same category as `api`.
  web:
    build: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
  prefectdata:
