services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slop_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-slopornot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slop} -d ${POSTGRES_DB:-slopornot}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-slopadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-slop_dev_password}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 5. Day-to-day development still runs `uv run uvicorn ... --reload` directly on
  # the host against these services' published ports - this service is for "does the
  # container build and boot" verification, not the primary dev loop. Note: presigned
  # thumbnail URLs generated by THIS service embed http://minio:9000 (the compose-internal
  # hostname), unreachable from a host browser - see docs/writeups/phase-5/stage-9-docker-compose.md.
  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      S3_ENDPOINT_URL: http://minio:9000
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
